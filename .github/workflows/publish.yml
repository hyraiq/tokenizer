name: Publish

# Manually triggered from the Actions tab. Publishes the current package.json
# version to GitHub Packages; npm rejects the run if that version already exists.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # prepublishOnly rebuilds dist/ before packing. The committed .npmrc points
      # the @hyraiq scope at GitHub Packages and reads NPM_AUTH_TOKEN for auth.
      - run: npm publish
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
